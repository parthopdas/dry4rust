[package]
name = "dry4rust"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "Tree-edit-distance duplicate-code detector for Rust codebases"
license = "MIT"

[lib]
name = "dry4rust"
path = "src/lib.rs"

[[bin]]
name = "dry4rust"
path = "src/main.rs"

[dependencies]
# Core error types (lib).
thiserror = "2.0"

# Bin-only wiring.
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }

# Adapters (confined to their own modules).
syn = { version = "2.0", features = ["full", "visit", "extra-traits"] }
ignore = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
